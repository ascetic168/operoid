[package]
name = "ocore"
version = "0.4.5"
edition = "2021"
description = "Operoid 核心域 crate — Runtime/Store/Tools/GBrain 能力（零 Tauri 依賴）"
authors = ["朱國棟 (Charlie Chu)"]
license = "MIT"

[dependencies]
ocontract = { path = "../ocontract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.7"
csv = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
# K1 MinerU converter：解壓 mineru-kit zip 產出＋圖檔內容指紋（sidecar 去重鍵）。
zip = { version = "0.6", default-features = false, features = ["deflate"] }
md-5 = "0.10"
# K3 sidecar：圖檔以 data URI 送 llama-server 多模態嵌入。
base64 = "0.22"
# R2（遠端化）：CSPRNG token 生成＋帳號密碼雜湊（C12b 最小版）。
getrandom = "0.2"
argon2 = "0.5"
rmcp = { version = "3", features = ["client", "transport-child-process"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }
