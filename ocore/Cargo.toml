[package]
name = "ocore"
version = "0.2.7"
edition = "2021"
description = "Operoid 核心域 crate — Runtime/Store/Tools/GBrain 能力（零 Tauri 依賴）"
authors = ["朱國棟 (Charlie Chu)"]
license = "MIT"

[dependencies]
ocontract = { path = "../ocontract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
