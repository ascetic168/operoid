[package]
name = "oserver"
version = "0.4.3"
edition = "2021"
description = "Operoid 服務 binary — axum HTTP API（前後端分離計畫 P2）"
authors = ["朱國棟 (Charlie Chu)"]
license = "MIT"

[dependencies]
ocore = { path = "../ocore" }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
# 遠端化 R1（DR-E6）：operoid.toml（企業模式服務組態）。
toml = "0.8"
# 遠端化 R3：SSE 短票 CSPRNG＋stream 組合。
getrandom = "0.2"
futures = "0.3"

# 服務註冊（P5）：SCM 整合＋UAC 自我提權——僅 Windows 需要。
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
runas = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
