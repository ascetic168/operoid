[package]
name = "oserver"
version = "0.3.0"
edition = "2021"
description = "Operoid 服務 binary — axum HTTP API（前後端分離計畫 P2）"
authors = ["朱國棟 (Charlie Chu)"]
license = "MIT"

[dependencies]
ocore = { path = "../ocore" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

# 服務註冊（P5）：SCM 整合＋UAC 自我提權——僅 Windows 需要。
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
runas = "1"
