[workspace]
resolver = "2"
members = [
    "src-tauri",
    "ocore",
    "ocontract",
    "obridge",
    "obridge-plugin-example",
]

# 集中管理 workspace 層級的編譯設定（自 src-tauri 上移）。
[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
