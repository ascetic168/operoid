name: enterprise-package

# 企業部署包（與桌面安裝包分開的 release 資產）：
#   推送 v* 標籤 → publish-tauri 建立草稿 Release（桌面安裝包＝個人版）→
#   本 job 接續編譯 oserver＋obridge（release）＋三個前端靜態檔，打包為
#   operoid-enterprise-<平台>.zip / .tar.gz 附加到同一個 Release。
#   企業部署者下載部署包即可照 DEPLOYMENT.md 部署（伺服器機不需 Node/pnpm）；
#   obridge 由 oserver 子行程代管（/admin「郵件橋接」表單設定），或複製到
#   能觸達郵件伺服器的機器做遠端橋接。
#
# 個人版與企業版在 release 資產層區分：桌面安裝包＝個人版；
# operoid-enterprise-*.zip/tar.gz＝企業版。版本與 CHANGELOG 仍單一真相。

on:
  workflow_dispatch: # 手動觸發（測試打包）
  workflow_run:
    workflows: [release]
    types: [completed]

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write # 附加資產到 Release 需要 write 權限
    strategy:
      fail-fast: false
      matrix:
        include:
          # 伺服器平台：Windows x64 與 Linux x64（DEPLOYMENT.md 的兩條路徑）
          - platform: 'windows-latest'
            archive: 'operoid-enterprise-windows-x64.zip'
          - platform: 'ubuntu-22.04'
            archive: 'operoid-enterprise-linux-x64.tar.gz'

    runs-on: ${{ matrix.platform }}

    steps:
      # workflow_run 觸發＝抓觸發 release 的同一個 tag（淺抓 default branch 不含
      # tag——v0.4.0 首跑事故）；workflow_dispatch＝抓觸發時選的 ref。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './oserver -> target'

      - name: build frontends（三角色前端靜態檔）
        working-directory: frontends
        run: |
          pnpm install --frozen-lockfile --allow-build=esbuild
          pnpm build

      - name: build oserver＋obridge（release）
        # obridge＝企業版郵件橋接執行檔：oserver 子行程代管（sibling 解析），
        # 也可單獨複製到能觸達郵件伺服器的機器做遠端橋接。
        run: cargo build --release -p oserver -p obridge

      - name: assemble package（windows）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $stage = "stage/operoid-enterprise"
          New-Item -ItemType Directory -Force -Path "$stage/frontends" | Out-Null
          Copy-Item target/release/oserver.exe "$stage/"
          Copy-Item target/release/obridge.exe "$stage/"
          Copy-Item obridge/config.example.toml "$stage/obridge.example.toml"
          foreach ($app in @('admin', 'manager', 'user')) {
            Copy-Item "frontends/apps/$app/dist" "$stage/frontends/$app" -Recurse
          }
          Copy-Item DEPLOYMENT.md "$stage/"
          Copy-Item deploy/operoid.example.toml "$stage/"
          Compress-Archive -Path "stage/operoid-enterprise/*" -DestinationPath "${{ matrix.archive }}"

      - name: assemble package（linux）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          stage="stage/operoid-enterprise"
          mkdir -p "$stage/frontends"
          cp target/release/oserver "$stage/"
          cp target/release/obridge "$stage/"
          cp obridge/config.example.toml "$stage/obridge.example.toml"
          for app in admin manager user; do
            cp -r "frontends/apps/$app/dist" "$stage/frontends/$app"
          done
          cp DEPLOYMENT.md "$stage/"
          cp deploy/operoid.example.toml "$stage/"
          tar -czf "${{ matrix.archive }}" -C stage operoid-enterprise

      # 套件先存成 workflow artifact（本地再以 PAT 附加到 Release——GITHUB_TOKEN
      # 對已存在 release 的 update 路徑曾回 403 not-accessible，見計畫文件 R8 紀錄）。
      - name: upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: attach to release（best-effort；GITHUB_TOKEN 權限允許時直接附）
        if: startsWith(github.event.workflow_run.head_branch || github.ref_name, 'v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
